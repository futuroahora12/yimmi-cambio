name: Compilar APK Yimmi Kambio

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Preparar carpeta www con index.html
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ ! -f "www/index.html" ]; then
            echo "No se encontro index.html en la raiz ni en www/index.html"
            exit 1
          fi

      - name: Instalar dependencias y crear proyecto Android con Capacitor
        run: |
          npm install
          npx cap add android
          npx cap copy android

      - name: Generar icono oficial en fondo morado para Android
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick

          mkdir -p /tmp/icon_work
          if [ -f "icon.png" ]; then
            cp icon.png /tmp/icon_work/logo_raw.png
          else
            curl -fsSL "https://i.postimg.cc/t4fJptrQ/BCV-20261120-041842-0000.png" -o /tmp/icon_work/logo_raw.png
          fi

          # Redimensiona el logo y lo centra sobre un lienzo cuadrado morado (#9333ea)
          convert /tmp/icon_work/logo_raw.png -resize 720x720 -background "#9333ea" -gravity center -extent 1024x1024 -alpha off /tmp/icon_work/icon_morado_1024.png

          # Elimina xml adaptativos que puedan forzar fondo blanco o azul de plantilla
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          declare -A DENSITIES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for dir in "${!DENSITIES[@]}"; do
            px="${DENSITIES[$dir]}"
            target="android/app/src/main/res/$dir"
            mkdir -p "$target"
            convert /tmp/icon_work/icon_morado_1024.png -resize "${px}x${px}" "$target/ic_launcher.png"
            convert /tmp/icon_work/icon_morado_1024.png -resize "${px}x${px}" "$target/ic_launcher_round.png"
            convert /tmp/icon_work/logo_raw.png -resize "${px}x${px}" -background "#9333ea" -gravity center -extent "${px}x${px}" -alpha off "$target/ic_launcher_foreground.png"
          done

      - name: Asegurar permiso de cámara en AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.CAMERA" \/>/' "$MANIFEST"
          fi

      - name: Preparar SDK y aceptar licencias en el runner
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || yes | sdkmanager --licenses || true

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Yimmi-Kambio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
