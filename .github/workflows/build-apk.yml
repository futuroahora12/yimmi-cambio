name: Compilar APK Yimmi Kambio

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: "34"
          build-tools: "34.0.0"

      - name: Aceptar licencias Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Preparar carpeta www con index.html
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Inicializar y sincronizar Capacitor Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Yimmi Kambio" "com.futuroahora.yimmikambio" --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Yimmi-Kambio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
